<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .header-text { font-family: Arial, sans-serif; }
      .table-header { font-size: 11px; font-weight: bold; fill: #666; }
      .table-cell { font-size: 10px; fill: #333; }
      .table-row { stroke: #e0e0e0; stroke-width: 1; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="1000" height="600" fill="white"/>

  <!-- Header -->
  <circle cx="25" cy="25" r="8" fill="#4CAF50"/>
  <text x="45" y="30" class="header-text" font-size="13" font-weight="bold" fill="#000">infinitepay</text>

  <!-- Title -->
  <text x="20" y="60" class="header-text" font-size="16" font-weight="bold" fill="#000">Relatório de movimentações</text>

  <!-- Period -->
  <text x="20" y="85" class="header-text" font-size="12" fill="#c41c3b">01 Mai, 2026 - 31 Mai, 2026</text>

  <!-- Saldo final label -->
  <text x="20" y="105" class="header-text" font-size="11" fill="#666">Saldo final do período</text>

  <!-- Red line accent -->
  <line x1="20" y1="115" x2="40" y2="115" stroke="#c41c3b" stroke-width="3"/>

  <!-- TABLE 1 HEADER -->
  <line x1="20" y1="145" x2="980" y2="145" stroke="#ddd" stroke-width="1"/>
  <text x="35" y="158" class="table-header">Data</text>
  <text x="120" y="158" class="table-header">Hora</text>
  <text x="200" y="158" class="table-header">Tipo de transação</text>
  <text x="400" y="158" class="table-header">Nome</text>
  <text x="720" y="158" class="table-header">Detalhe</text>
  <text x="920" y="158" class="table-header">Valor (R$)</text>

  <!-- TABLE 1 ROW 1 -->
  <line x1="20" y1="170" x2="980" y2="170" stroke="#f0f0f0" stroke-width="1"/>
  <text x="35" y="183" class="table-cell">01 Mai, 2026</text>
  <text x="120" y="183" class="table-cell">17:24</text>
  <text x="200" y="183" class="table-cell">-</text>
  <text x="400" y="183" class="table-cell">-</text>
  <text x="720" y="183" class="table-cell">-</text>
  <text x="920" y="183" class="table-cell">-</text>

  <!-- TABLE 2 HEADER -->
  <line x1="20" y1="210" x2="980" y2="210" stroke="#ddd" stroke-width="1"/>
  <text x="35" y="223" class="table-header">Data</text>
  <text x="120" y="223" class="table-header">Hora</text>
  <text x="200" y="223" class="table-header">Tipo de transação</text>
  <text x="400" y="223" class="table-header">Nome</text>
  <text x="720" y="223" class="table-header">Detalhe</text>
  <text x="920" y="223" class="table-header">Valor (R$)</text>

  <!-- TABLE 2 - Data -->
  <line x1="20" y1="235" x2="980" y2="235" stroke="#f0f0f0" stroke-width="1"/>
  <text x="35" y="248" class="table-cell" font-weight="bold">04 Mai, 2026</text>

  <!-- TABLE 2 - Rows with times -->
  <line x1="20" y1="260" x2="980" y2="260" stroke="#f5f5f5" stroke-width="1"/>
  <text x="120" y="273" class="table-cell">03:17</text>
  <text x="200" y="273" class="table-cell">.</text>
  <text x="400" y="273" class="table-cell">-</text>
  <text x="720" y="273" class="table-cell">.</text>
  <text x="920" y="273" class="table-cell">-</text>

  <line x1="20" y1="285" x2="980" y2="285" stroke="#f5f5f5" stroke-width="1"/>
  <text x="120" y="298" class="table-cell">03:17</text>
  <text x="200" y="298" class="table-cell">.</text>
  <text x="400" y="298" class="table-cell">-</text>
  <text x="720" y="298" class="table-cell">.</text>
  <text x="920" y="298" class="table-cell">-</text>

  <line x1="20" y1="310" x2="980" y2="310" stroke="#f5f5f5" stroke-width="1"/>
  <text x="120" y="323" class="table-cell">03:29</text>
  <text x="200" y="323" class="table-cell">.</text>
  <text x="400" y="323" class="table-cell">-</text>
  <text x="720" y="323" class="table-cell">.</text>
  <text x="920" y="323" class="table-cell">-</text>

  <line x1="20" y1="335" x2="980" y2="335" stroke="#f5f5f5" stroke-width="1"/>
  <text x="120" y="348" class="table-cell">08:55</text>
  <text x="200" y="348" class="table-cell">.</text>
  <text x="400" y="348" class="table-cell">-</text>
  <text x="720" y="348" class="table-cell">.</text>
  <text x="920" y="348" class="table-cell">-</text>

  <line x1="20" y1="360" x2="980" y2="360" stroke="#f5f5f5" stroke-width="1"/>
  <text x="120" y="373" class="table-cell">10:09</text>
  <text x="200" y="373" class="table-cell">.</text>
  <text x="400" y="373" class="table-cell">-</text>
  <text x="720" y="373" class="table-cell">.</text>
  <text x="920" y="373" class="table-cell">-</text>

  <!-- Footer note -->
  <text x="20" y="440" class="header-text" font-size="9" fill="#999" font-style="italic">Exemplo real do Relatório de Movimentações da InfinitePay</text>

  <!-- Watermark -->
  <text x="500" y="550" class="header-text" font-size="11" text-anchor="middle" fill="#ddd" font-weight="bold">PREVIEW DO LAYOUT</text>
</svg>
